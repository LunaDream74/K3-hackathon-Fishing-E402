<title>Hộp thư — Máy chủ thử cho tiện ích PhishShield</title>
<!--
  ============================================================================
  HOST PAGE — hộp thư giả lập để tiện ích PhishShield tiêm vào.

  QUY TẮC SỐ MỘT: file này KHÔNG chứa một dòng nào của PhishShield.
  Nó là "trang chủ nhà" — tiện ích phải tự tìm, tự đọc, tự chèn vào.
  Nếu bạn thấy mình sắp thêm logic phân tích vào đây, dừng lại: chỗ đó
  thuộc về content script của tiện ích.

  Trang này cố tình mô phỏng phần KHÓ của Gmail, không phải phần dễ:
  mở một thư khác KHÔNG tải lại trang — DOM bị thay tại chỗ (giống SPA).
  Nhờ vậy adapter viết cho trang này sẽ chuyển sang Gmail được, vì nó
  buộc phải dùng MutationObserver ngay từ đầu.

  Hợp đồng DOM: xem DOM-CONTRACT.md cùng thư mục.
  ============================================================================
-->
<style>
  :root {
    --app: #ffffff; --app-2: #f4f6f9; --app-3: #e9edf3;
    --rule: #dbe1ea; --ink: #11151c; --ink-2: #4b5566; --ink-3: #6b7385;
    --sel: #e7eafb; --sel-ink: #1f34c4;
    --mono: ui-monospace, "Cascadia Mono", Consolas, "DejaVu Sans Mono", monospace;
    --sans: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font-family: var(--sans); font-size: 15px; color: var(--ink); background: var(--app); line-height: 1.55; }
  button { font: inherit; color: inherit; cursor: pointer; }

  .top {
    display: flex; align-items: center; gap: 14px; padding: 10px 18px;
    border-bottom: 1px solid var(--rule); background: var(--app-2);
  }
  .top .logo { font-size: 17px; font-weight: 700; letter-spacing: -.02em; }
  .top .search {
    flex: 1; max-width: 620px; background: var(--app); border: 1px solid var(--rule);
    border-radius: 8px; padding: 8px 13px; color: var(--ink-3); font-size: 14px;
  }
  .top .me { width: 32px; height: 32px; border-radius: 50%; background: var(--app-3); display: grid; place-items: center; font-weight: 700; font-size: 13px; color: var(--ink-2); }

  /* Giả lập máy chủ đẩy thư mới về. Đây là hành vi của ứng dụng thư, KHÔNG phải
     của PhishShield — trang này vẫn không chứa dòng nào của tiện ích.
     Dùng khi demo: để khán giả chọn loại thư sắp đến, rồi xem tiện ích tự phản ứng. */
  .deliver { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; }
  .deliver .lbl { font-family: var(--mono); font-size: 11px; letter-spacing: .1em;
    text-transform: uppercase; color: var(--ink-3); }
  .deliver button {
    font-family: var(--mono); font-size: 12px; font-weight: 600; padding: 5px 10px;
    border: 1px solid var(--rule); background: var(--app); color: var(--ink-2);
    border-radius: 3px; cursor: pointer; transition: .14s;
  }
  .deliver button:hover { border-color: var(--sel-ink); color: var(--sel-ink); background: var(--sel); }
  .deliver button:focus-visible { outline: 2px solid var(--sel-ink); outline-offset: 2px; }
  .deliver button:disabled { opacity: .45; cursor: default; }
  .deliver .k-safe:hover   { border-color: #0a6a3e; color: #0a6a3e; background: #e4f5eb; }
  .deliver .k-doubt:hover  { border-color: #835500; color: #835500; background: #fcf3de; }
  .deliver .k-danger:hover { border-color: #bf0f1d; color: #bf0f1d; background: #fdecec; }

  .incoming {
    font-family: var(--mono); font-size: 12px; color: var(--sel-ink);
    display: inline-flex; align-items: center; gap: 7px;
  }
  .incoming .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--sel-ink);
    animation: pulse 1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1 } 50% { opacity: .25 } }

  .row.fresh { animation: land .5s ease; }
  @keyframes land { from { background: var(--sel); transform: translateY(-6px); } to { background: transparent; transform: none; } }
  .row .new-tag { font-family: var(--mono); font-size: 9.5px; font-weight: 700; letter-spacing: .06em;
    color: #fff; background: var(--sel-ink); border-radius: 8px; padding: 1px 6px; margin-left: 6px; }
  @media (prefers-reduced-motion: reduce) {
    .row.fresh { animation: none; } .incoming .dot { animation: none; }
  }

  .wrap { display: grid; grid-template-columns: 176px 300px minmax(0, 1fr); min-height: calc(100vh - 53px); }
  @media (max-width: 1000px) { .wrap { grid-template-columns: 1fr; } .nav, .list { display: none; } }

  .nav { padding: 14px 10px; border-right: 1px solid var(--rule); background: var(--app-2); }
  .nav .new { width: 100%; text-align: left; background: var(--app); border: 1px solid var(--rule); border-radius: 18px; padding: 9px 15px; font-weight: 600; color: var(--ink-2); margin-bottom: 14px; }
  .nav ul { list-style: none; margin: 0; padding: 0; }
  .nav li { padding: 7px 12px; border-radius: 14px; font-size: 14px; color: var(--ink-2); display: flex; }
  .nav li.on { background: var(--sel); color: var(--sel-ink); font-weight: 700; }
  .nav li .n { margin-left: auto; font-family: var(--mono); font-size: 11.5px; }

  .list { border-right: 1px solid var(--rule); overflow-y: auto; }
  .row {
    display: block; width: 100%; text-align: left; background: transparent; border: 0;
    border-bottom: 1px solid var(--rule); padding: 11px 14px;
  }
  .row:hover { background: var(--app-2); }
  .row[aria-current="true"] { background: var(--sel); }
  .row:focus-visible { outline: 2px solid var(--sel-ink); outline-offset: -2px; }
  .row .l1 { display: flex; align-items: baseline; gap: 8px; }
  .row .who { font-size: 14px; color: var(--ink-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .t { margin-left: auto; font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
  .row .sub { font-size: 14px; margin-top: 1px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row .snip { font-size: 12.5px; color: var(--ink-3); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .row.unread .who, .row.unread .sub { font-weight: 700; color: var(--ink); }

  .read { padding: 20px clamp(16px, 3vw, 34px) 60px; overflow-y: auto; }
  .read h1 { margin: 0 0 16px; font-size: 22px; font-weight: 600; letter-spacing: -.015em; }
  .from { display: flex; align-items: center; gap: 12px; margin-bottom: 4px; }
  .from .av { width: 38px; height: 38px; border-radius: 50%; background: var(--app-3); display: grid; place-items: center; font-weight: 700; color: var(--ink-2); font-size: 14px; flex: none; }
  .from .who b { font-size: 14.5px; }
  .from .who .addr { font-family: var(--mono); font-size: 12.5px; color: var(--ink-2); word-break: break-all; }
  .from .when { margin-left: auto; font-size: 12.5px; color: var(--ink-3); white-space: nowrap; }

  details.orig { margin: 14px 0 0; border: 1px solid var(--rule); border-radius: 6px; background: var(--app-2); }
  details.orig summary { padding: 8px 13px; font-size: 13px; color: var(--ink-2); cursor: pointer; }
  details.orig pre {
    margin: 0; padding: 0 13px 13px; font-family: var(--mono); font-size: 12px; color: var(--ink-2);
    white-space: pre-wrap; word-break: break-word; overflow-x: auto;
  }

  .msgbody { margin-top: 18px; font-size: 15px; line-height: 1.75; max-width: 68ch; }
  .msgbody p { margin: 0 0 13px; }
  .msgbody a { color: #1a56d6; word-break: break-all; }

  .replybar { margin-top: 26px; display: flex; gap: 9px; }
  .replybar button { border: 1px solid var(--rule); background: var(--app); border-radius: 18px; padding: 8px 18px; font-size: 14px; color: var(--ink-2); }

  .hidden { display: none !important; }

  .devnote {
    margin: 26px 0 0; border-top: 1px dashed var(--rule); padding-top: 12px;
    font-family: var(--mono); font-size: 11.5px; color: var(--ink-3); line-height: 1.7;
  }
</style>
</head>

      { name: "Truyền thông nội bộ", initials: "TT", addr: "no-reply@vinai.io",
        subject: "Lịch nghỉ lễ Quốc khánh",
        snippet: "Thông báo lịch nghỉ lễ Quốc khánh của công ty…",
        body: "<p>Chào các anh chị,</p><p>Công ty thông báo lịch nghỉ lễ Quốc khánh. " +
              "Anh chị sắp xếp công việc phù hợp.</p>" +
              '<p>Chi tiết: <a href="https://vingroup.net/thong-bao/nghi-le">https://vingroup.net/thong-bao/nghi-le</a></p>' +
              "<p>Phòng Truyền thông</p>" }
    ]
  };
  var qIndex = { danger: 0, doubt: 0, safe: 0 };
  var newCount = 0;
  var currentId = null;   // thư đang mở, để vẽ lại danh sách mà không mất highlight

  var listEl = document.getElementById("list");
  var readEl = document.getElementById("read");

  function esc(s) {
    return String(s).replace(/[&<>"]/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c];
    });
  }

  function drawList(activeId) {
    listEl.innerHTML = MAIL.map(function (m) {
      return '<button class="row' + (m.unread ? " unread" : "") + (m.fresh ? " fresh" : "") +
             '" role="listitem" type="button" ' +
             'data-open="' + m.id + '" aria-current="' + (m.id === activeId) + '">' +
               '<div class="l1"><span class="who">' + esc(m.name) +
               (m.fresh ? '<span class="new-tag">MỚI</span>' : "") + "</span>" +
               '<span class="t">' + esc(m.time) + "</span></div>" +
               '<div class="sub">' + esc(m.subject) + "</div>" +
               '<div class="snip">' + esc(m.snippet) + "</div>" +
             "</button>";
    }).join("");
  }

  /* Thư mới "bay về": xuất hiện ở đầu danh sách rồi tự mở, để tiện ích phản ứng
     ngay trước mắt khán giả. Vì mở thư KHÔNG tải lại trang, đây cũng chính là
     đường mà MutationObserver của adapter phải bắt được. */
  function deliver(kind) {
    if (kind === "any") {
      var kinds = ["safe", "doubt", "danger"];
      kind = kinds[Math.floor(Math.random() * kinds.length)];
    }
    var pool = QUEUE[kind];
    if (!pool || !pool.length) return;

    var tpl = pool[qIndex[kind] % pool.length];
    qIndex[kind]++;

    var btns = document.querySelectorAll("#deliver button");
    btns.forEach(function (b) { b.disabled = true; });
    document.getElementById("incoming").classList.remove("hidden");

    setTimeout(function () {
      newCount++;
      var mail = {
        id: "t-new-" + newCount,
        unread: true, fresh: true, time: "Vừa xong",
        name: tpl.name, initials: tpl.initials, addr: tpl.addr,
        subject: tpl.subject, snippet: tpl.snippet,
        raw: "From: " + tpl.name + " <" + tpl.addr + ">\nSubject: " + tpl.subject,
        body: tpl.body
      };
      MAIL.unshift(mail);

      document.getElementById("incoming").classList.add("hidden");

      // Thư đến thì nằm CHƯA ĐỌC ở đầu danh sách, KHÔNG tự mở.
      // Thư thật cũng không tự bật ra, và quan trọng hơn: người trình bày cần
      // giữ nhịp — "có thư mới này, mình mở thử xem" — chứ không để máy mở hộ
      // rồi chạy phân tích trước cả khi khán giả kịp nhìn.
      drawList(currentId);

      setTimeout(function () {
        btns.forEach(function (b) { b.disabled = false; });
      }, 320);
    }, 780);
  }

  /* Mở thư = thay mới toàn bộ khung đọc. KHÔNG tải lại trang.
     Đây chính là điều buộc adapter phải dùng MutationObserver. */
  function openMail(id) {
    var m = MAIL.filter(function (x) { return x.id === id; })[0];
    if (!m) return;
    m.unread = false;
    m.fresh = false;      // bỏ nhãn MỚI khi người dùng đã mở
    currentId = id;

    readEl.innerHTML =
      '<article data-ps-thread data-ps-thread-id="' + esc(m.id) + '">' +
        '<h1 data-ps-field="subject">' + esc(m.subject) + "</h1>" +
        '<div class="from">' +
          '<div class="av">' + esc(m.initials) + "</div>" +
          '<div class="who">' +
            '<b data-ps-field="from-name">' + esc(m.name) + "</b>" +
            '<div class="addr" data-ps-field="from-address">' + esc(m.addr) + "</div>" +
          "</div>" +
          '<div class="when" data-ps-field="date">' + esc(m.time) + "</div>" +
        "</div>" +

        /* Điểm tiện ích chèn banner vào. Host chừa sẵn chỗ, không tự vẽ gì. */
        '<div data-ps-slot="banner"></div>' +

        '<details class="orig"><summary>Hiển thị bản gốc (header)</summary>' +
          '<pre data-ps-field="raw-headers">' + esc(m.raw) + "</pre>" +
        "</details>" +

        '<div class="msgbody" data-ps-field="body">' + m.body + "</div>" +

        '<div class="replybar">' +
          "<button type=\"button\">↩︎ Trả lời</button>" +
          "<button type=\"button\">↪︎ Chuyển tiếp</button>" +
        "</div>" +

        '<div class="devnote">host: inbox-mock · contract v1 · thread ' + esc(m.id) +
        " — trang này không chứa mã PhishShield; tiện ích phải tự tiêm vào.</div>" +
      "</article>";

    document.getElementById("unreadCount").textContent =
      MAIL.filter(function (x) { return x.unread; }).length || "";
    drawList(id);
  }

  listEl.addEventListener("click", function (e) {
    var btn = e.target.closest("[data-open]");
    if (btn) openMail(btn.getAttribute("data-open"));
  });

  document.getElementById("deliver").addEventListener("click", function (e) {
    var btn = e.target.closest("[data-kind]");
    if (btn && !btn.disabled) deliver(btn.getAttribute("data-kind"));
  });

  drawList(MAIL[0].id);
  openMail(MAIL[0].id);
})();
</script>
</body>
</html>
